trajectory_metric:
  ros__parameters:
    odom_topic: /bumperbot_controller/odom
    jitter_guard: 0.002
    max_gap_dt: 0.5
    rpe_delta: 1.0

    episode_event_topic: /navlearn/episode_event
    trajectory_metric_topic: /navlearn/trajectory_metric

    # Collision events: one std_msgs/Empty per contact event (rising-edge).
    # For Gazebo Ignition: published by collision_monitor (launched alongside benchmarks).
    # For Isaac Sim: published by the OmniGraph extension in docs/isaac_sim/.
    # If not running either adapter, collision_count will remain 0 for all episodes.
    collision_topic: /navlearn/collision

    # Scan-based collision detection threshold [m].
    # A rising-edge collision is counted when the minimum valid LiDAR range <= this value.
    # 0.15 m ≈ robot radius (0.13 m) + sensor noise buffer.
    # Set to 0.0 to disable scan-based detection (use only /navlearn/collision topic events).
    collision_scan_threshold_m: 0.15

    # Ground truth pose topic (geometry_msgs/TransformStamped).
    # For Gazebo Ignition: published by navlearn_benchmarks/ground_truth_publisher
    #   (enabled via localization_eval_enabled:=true at launch).
    # For Isaac Sim: publish TransformStamped directly to this topic via the Isaac ROS bridge.
    # If not running a GT source, ATE/RPE will report NaN (safe default).
    gt_topic: /bumperbot/ground_truth_pose