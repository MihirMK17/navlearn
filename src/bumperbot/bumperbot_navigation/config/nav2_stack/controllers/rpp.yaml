# nav2_stack/controllers/rpp.yaml
#
# Regulated Pure Pursuit. Loaded AFTER common/controller_common.yaml.
#
# Contains the FollowPath block and nothing else. No goal checker, no progress checker,
# no local_costmap — those live in common/ and copying them here would reintroduce
# audit finding F-5.
#
# VELOCITY PARITY: desired_linear_vel matches mppi.yaml vx_max and dwb.yaml max_vel_x
# (all 0.30 m/s), and the angular acceleration limit matches both (3.2 rad/s^2). Speed is
# a legitimate controller tuning knob, but letting it differ across arms confounds
# "which controller is better" with "which controller was allowed to go faster" — which
# is exactly what the old rpp_aggressive vs mppi_baseline comparison did. The
# ablations/high_vx.yaml overlay probes sensitivity to this choice deliberately.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.30            # m/s.  <-- velocity parity anchor
      lookahead_dist: 0.6                 # m. Used when velocity scaling is off.
      min_lookahead_dist: 0.3             # m. Range 0.1-1.0.
      max_lookahead_dist: 0.9             # m. Range 0.5-2.0.
      lookahead_time: 1.5                 # s. Velocity-scaled lookahead = vel * this.
      use_velocity_scaled_lookahead_dist: true

      rotate_to_heading_angular_vel: 1.8  # rad/s
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785  # rad (45 deg). Rotate in place beyond this.
      max_angular_accel: 3.2              # rad/s^2.  <-- parity with mppi az_max, dwb acc_lim_theta

      min_approach_linear_velocity: 0.05  # m/s. Floor when decelerating into the goal.
      approach_velocity_scaling_dist: 1.0 # m. Distance over which to decelerate.

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0   # s

      use_regulated_linear_velocity_scaling: true       # Slow on tight curvature.
      use_cost_regulated_linear_velocity_scaling: false # Slow near obstacles. Off: the
                                                        # obstacle response under test is the
                                                        # controller's, not a cost heuristic's.
      regulated_linear_scaling_min_radius: 0.9          # m
      regulated_linear_scaling_min_speed: 0.25          # m/s

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0       # m
      max_robot_pose_search_dist: 10.0    # m
      interpolate_curvature_after_goal: false
      transform_tolerance: 0.2            # s

      cost_scaling_dist: 0.3              # m. Only used if cost-regulated scaling is on.
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0  # Must equal local_costmap inflation_layer
                                          # cost_scaling_factor in common/controller_common.yaml.
                                          # Asserted at launch.
