# nav2_stack/controllers/mppi.yaml
#
# Model Predictive Path Integral controller. Loaded AFTER common/controller_common.yaml.
#
# Contains the FollowPath block and nothing else. No goal checker, no progress checker,
# no local_costmap.
#
# ---------------------------------------------------------------------------
# CORRECTED FROM nav2_profiles/mppi_baseline (audit addendum A-3):
#
#   ObstaclesCritic.cost_scaling_factor was 10.0 while local_costmap.inflation_layer
#   used 3.0 (mppi_baseline) and 3.5 (mppi_aggressive). Nav2 requires these to match:
#   the critic reconstructs obstacle distance from costmap cost values by inverting the
#   inflation curve, so a critic factor above the costmap's makes every obstacle appear
#   NEARER than it is. Both MPPI arms in the old campaign therefore ran with an inflated
#   sense of obstacle proximity. Any prior "MPPI underperforms RPP" conclusion was drawn
#   against a handicapped MPPI and is retired along with the rest of that data.
#
#   Set to 3.0 here to match common/controller_common.yaml. navigation.launch.py asserts
#   the match at launch and refuses to start on mismatch.
# ---------------------------------------------------------------------------

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 56                      # Horizon steps. 56 * 0.05 s = 2.8 s.
      model_dt: 0.05                      # s. Should match 1/controller_frequency (20 Hz).
      batch_size: 2000                    # Sampled trajectories per iteration. Range 500-3000.
      iteration_count: 1

      # ---- velocity parity anchor: matches rpp desired_linear_vel and dwb max_vel_x ----
      vx_max: 0.30                        # m/s
      vx_min: -0.20                       # m/s. Reverse allowed.
      vy_max: 0.0                         # m/s. Diff-drive.
      wz_max: 1.9                         # rad/s

      ax_max: 3.0                         # m/s^2
      ax_min: -3.0                        # m/s^2
      az_max: 3.2                         # rad/s^2.  <-- parity with rpp max_angular_accel

      vx_std: 0.2                         # Sampling noise std, m/s.
      vy_std: 0.0
      wz_std: 0.4                         # rad/s

      temperature: 0.3                    # Softmax selectiveness. Lower = greedier.
      gamma: 0.015                        # Control-cost weight.

      motion_model: "DiffDrive"
      prune_distance: 1.7                 # m. Path pruned ahead of the robot.
      transform_tolerance: 0.2            # s
      visualize: false                    # Off: publishing candidate trajectories costs CPU,
                                          # and compute is a measured variable.
      reset_period: 1.0                   # s
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: [
        "ConstraintCritic",
        "ObstaclesCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.0
        critical_weight: 20.0
        consider_footprint: false         # Footprint mode broke activation on nav2 humble
                                          # 1.1.18; circular robot_radius 0.1 is adequate.
        collision_cost: 10000.0
        collision_margin_distance: 0.10   # m
        near_goal_distance: 0.5           # m
        inflation_radius: 0.55            # m.  MUST equal local_costmap inflation_layer
        cost_scaling_factor: 3.0          #     MUST equal local_costmap inflation_layer
                                          #     (was 10.0 — see header). Asserted at launch.

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0                  # CORRECTED 2026-08-01 (was 5.0; briefly 15.0).
                                          # Chosen from a measured weight-by-regime
                                          # interaction, true-success rates:
                                          #
                                          #   weight   clean    TTC bad-init
                                          #      5     89.5%      62.5%   parks 0.150 m
                                          #                               short for 158 s
                                          #      8    100.0%      65.0%   <- this value
                                          #     15    100.0%      30.3%   1 cm/s crawls
                                          #                               while AMCL
                                          #                               re-converges
                                          #
                                          # At 5 the goal term is outvoted by
                                          # PathAlignCritic (18) + PathFollowCritic (10)
                                          # in the final approach and MPPI cannot finish;
                                          # at 15 the amplified term follows the swinging
                                          # estimate under injected covariance and the
                                          # optimizer dithers. Neither endpoint serves
                                          # both regimes -- itself a finding. Alternative
                                          # knobs (iteration_count 2, vx_std 0.10) both
                                          # made the clean regime worse. MPPI-internal:
                                          # shared tolerances and speed envelope
                                          # untouched, so cross-controller parity holds.
                                          # Evidence: results/mppi_probe3_*,
                                          # results/mppi_goalw8_*, leg1 v1/v2 arms.
        threshold_to_consider: 1.4        # m

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5        # m

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0                 # Keeps MPPI on the planner's path.
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5        # m
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4        # m

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5        # m
        max_angle_to_furthest: 1.0        # rad
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5        # m
