# nav2_stack/common/controller_common.yaml
#
# PARITY FILE. Loaded FIRST for controller_server, before controllers/<c>.yaml and
# before any ablations/<a>.yaml. ROS 2 merges a parameters=[...] list in order, later
# entries winning, so anything here is the default that a controller fragment inherits
# and only an ablation may deliberately override.
#
# Everything in this file answers one of two questions:
#   1. What counts as having arrived?   (goal checker, progress checker)
#   2. What does the robot perceive?    (local_costmap)
# Neither is a property of the controller. If either differs between RPP, DWB and MPPI,
# the controller comparison measures the difference in the question, not in the answer.
# Audit finding F-5 (xy_goal_tolerance 0.05/0.08/0.10 and movement_time_allowance 6/60
# across arms) is fixed structurally here: there is exactly one copy.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0            # Hz. Control loop rate. Identical for all controllers.
    min_x_velocity_threshold: 0.001       # m/s. Below this, treated as stopped.
    min_y_velocity_threshold: 0.05        # m/s. Diff-drive: y is never commanded.
    min_theta_velocity_threshold: 0.001   # rad/s
    failure_tolerance: 0.3                # s. Controller may fail this long before abort.
    odom_topic: /bumperbot_controller/odom
    controller_plugins: ["FollowPath"]    # The FollowPath block itself comes from controllers/<c>.yaml
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker_plugin: "progress_checker"

    # ------------------------------------------------------------------
    # SUCCESS DEFINITION — the most parity-critical block in the stack.
    # Do not copy these keys into any controllers/*.yaml. Ever.
    # ------------------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05      # m. Must move at least this far...
      movement_time_allowance: 60.0       # s. ...within this window, else FAILED.
                                          # Range 5-120. Was 6.0 on rpp_aggressive and
                                          # 60.0 on mppi_baseline (audit F-5) — a 10x gap
                                          # that alone could explain the old MPPI/RPP split.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05             # m. Range 0.02-0.5. NOTE: this is the *reported*
                                          # success radius, measured on the AMCL estimate.
                                          # Terminal ground-truth distance is logged separately
                                          # by the harness — that is the paper's headline number.
      yaw_goal_tolerance: 0.05            # rad. Range 0.02-0.5.
      stateful: true                      # Latch xy success while rotating to final yaw.

# ---------------------------------------------------------------------------
# LOCAL COSTMAP — what the robot perceives.
#
# Deliberately here and not in controllers/*.yaml (a departure from EXECUTION_SPEC,
# which sketched it per-controller). Rationale: the old campaign ran baseline arms on
# a 3x3 m costmap with inflation_radius 0.55 and aggressive arms on 4x4 m with 0.35/0.45.
# Those arms did not see the same world, so "controller X beat controller Y" was not a
# controller result. One costmap for all three controllers removes that confound.
#
# COUPLING WARNING: MPPI's ObstaclesCritic carries its own inflation_radius and
# cost_scaling_factor, which Nav2 requires to equal the values below. They are duplicated
# in controllers/mppi.yaml out of necessity. navigation.launch.py asserts they match at
# launch and shuts down on mismatch — see _assert_costmap_critic_parity().
# ---------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0               # Hz
      publish_frequency: 2.0              # Hz
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.1                   # m
      resolution: 0.05                    # m/cell
      always_send_full_costmap: true
      rolling_window: true
      width: 3                            # m. Must exceed the longest controller horizon:
      height: 3                           # m. MPPI is 56 steps x 0.05 s x 0.30 m/s = 0.84 m.

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0        # m
          marking: true
          clearing: true
          combination_method: 1
          raytrace_max_range: 3.0         # m
          raytrace_min_range: 0.0         # m
          obstacle_max_range: 2.5         # m
          obstacle_min_range: 0.0         # m

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55            # m.  <-- mirrored in controllers/mppi.yaml
        cost_scaling_factor: 3.0          # <-- mirrored in controllers/mppi.yaml
