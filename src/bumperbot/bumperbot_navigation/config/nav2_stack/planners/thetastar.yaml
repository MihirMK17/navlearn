# nav2_stack/planners/thetastar.yaml
#
# Theta* (any-angle A*). PROBE ONLY — one cell, TTC extreme, RPP controller.
# Loaded AFTER common/planner_common.yaml.
#
# Second half of the planner probe. Chosen alongside NavFn because the two bracket SMAC 2D:
# NavFn is grid-constrained Dijkstra, Theta* relaxes paths off the grid via line-of-sight
# checks. If false-success rate is insensitive across that spread, it is insensitive to
# planner choice generally.

planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8                 # 8-connected grid. Range {4, 8}.
      w_euc_cost: 1.0                     # Weight on straight-line distance.
      w_traversal_cost: 2.0               # Weight on cell cost. Set to match smac2d.yaml
                                          # cost_travel_multiplier so obstacle avoidance
                                          # aggressiveness is comparable.
      allow_unknown: true                 # Matched to smac2d.yaml.
