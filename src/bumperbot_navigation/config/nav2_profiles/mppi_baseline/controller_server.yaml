controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /bumperbot_controller/odom
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker_plugin: "progress_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 60.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Trajectory sampling — 2.8 s horizon at 20 Hz; batch scaled from 2000@30Hz heuristic
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1

      # Velocity limits — conservative, targets ~0.22 m/s to match RPP baseline behavior
      vx_max: 0.22
      vx_min: -0.05
      vy_max: 0.0
      wz_max: 1.8

      # Acceleration limits — gentle ramp for stability
      ax_max: 1.0
      ax_min: -1.0
      az_max: 1.5

      # Sampling noise — tight; keeps trajectories near low-speed regime
      vx_std: 0.1
      vy_std: 0.0
      wz_std: 0.3

      temperature: 0.3
      gamma: 0.015

      motion_model: "DiffDrive"

      prune_distance: 1.7
      transform_tolerance: 0.2
      visualize: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0          # slightly raised for tighter safety margin
        critical_cost: 300.0
        consider_footprint: true  # essential for 0.1 m robot
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0         # raised from default 14.0; baseline hugs path tightly
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0          # raised from default 2.0; primary anti-wobble on diff-drive
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true  # critical: penalizes backward heading on diff-drive

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.1
      resolution: 0.05
      always_send_full_costmap: true
      rolling_window: true
      width: 3
      height: 3

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          combination_method: 1
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
