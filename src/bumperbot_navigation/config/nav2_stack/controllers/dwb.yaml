# nav2_stack/controllers/dwb.yaml
#
# Dynamic Window Approach. Loaded AFTER common/controller_common.yaml.
#
# NEW for the 2026 rebuild — DWB was never run in the old campaign. Derived from the Nav2
# Humble reference parameters, with the velocity and acceleration envelope retuned from
# TurtleBot3 defaults to match this robot and the other two controllers.
#
# Deltas from the Nav2 reference set, and why:
#
#   max_vel_x / max_speed_xy   0.26 -> 0.30   velocity parity with rpp.yaml
#                                             desired_linear_vel and mppi.yaml vx_max.
#   max_vel_theta              1.0  -> 1.9    parity with mppi.yaml wz_max.
#   acc_lim_x / decel_lim_x    2.5  -> 3.0    parity with mppi.yaml ax_max / ax_min.
#   xy_goal_tolerance          0.25 -> 0.05   see the note below.
#   vy_samples                 5    -> 1      diff-drive; sampling lateral velocity that
#                                             the robot cannot execute wastes compute,
#                                             and compute is a measured variable.
#
# NOTE ON DWB's OWN xy_goal_tolerance. Unlike RPP and MPPI, DWB carries a goal tolerance
# inside its FollowPath block. It does NOT declare navigation success — the
# general_goal_checker in common/controller_common.yaml does that, for all three
# controllers. DWB's copy only gates when the RotateToGoal critic takes over from path
# following. It is set to 0.05 to match the goal checker so the handover happens exactly
# at the success radius rather than 0.25 m early. This is the one DWB parameter most
# likely to need adjustment after the pilot cell: too tight a handover radius can make DWB
# oscillate on final approach. Flag for pilot review, do not silently retune mid-campaign.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # ---- velocity parity anchor: matches rpp desired_linear_vel and mppi vx_max ----
      min_vel_x: 0.0                      # m/s
      max_vel_x: 0.30                     # m/s
      min_vel_y: 0.0                      # m/s. Diff-drive.
      max_vel_y: 0.0                      # m/s. Diff-drive.
      max_vel_theta: 1.9                  # rad/s
      min_speed_xy: 0.0                   # m/s
      max_speed_xy: 0.30                  # m/s
      min_speed_theta: 0.0                # rad/s

      acc_lim_x: 3.0                      # m/s^2
      acc_lim_y: 0.0                      # m/s^2
      acc_lim_theta: 3.2                  # rad/s^2
      decel_lim_x: -3.0                   # m/s^2
      decel_lim_y: 0.0                    # m/s^2
      decel_lim_theta: -3.2               # rad/s^2

      vx_samples: 20                      # Velocity samples per axis. Range 5-30.
      vy_samples: 1                       # Diff-drive: no lateral motion to sample.
      vtheta_samples: 20

      sim_time: 1.7                       # s. Forward rollout horizon.
      linear_granularity: 0.05            # m. Trajectory point spacing.
      angular_granularity: 0.025          # rad
      transform_tolerance: 0.2            # s

      xy_goal_tolerance: 0.05             # m. RotateToGoal handover only — NOT the success
                                          # criterion. See header note.
      trans_stopped_velocity: 0.25        # m/s
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
