# nav2_stack/localizers/amcl_tuned.yaml
#
# THE CAMPAIGN DEFAULT localizer — fixed for all 72 cells except the two-cell AMCL probe.
# Identical in content to bumperbot_localization/config/amcl_phase2.yaml, relocated here so
# the whole stack composes from one directory.
#
# Five parameters were tuned away from the Nav2 defaults during Phase 2 to address particle
# divergence in the open areas of small_house. Each is marked TUNED below with its prior
# value. localizers/amcl_default.yaml holds those prior values and exists so the tuning's
# cost can be measured rather than assumed: the Phase 1 vs Phase 2 comparison found tuning
# helps under bad-initialization (TTC) but hurts under extreme kidnap (TTR), and that
# no-free-lunch result is worth preserving with a cheap two-cell probe.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0              # s
    save_pose_rate: 0.5                   # Hz

    set_initial_pose: true                # The harness overrides the pose per run; this
    initial_pose:                         # only defines the pre-perturbation origin.
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05                          # rot noise from rot. Range 0.01-0.5.
    alpha2: 0.05                          # rot noise from trans.
    alpha3: 0.05                          # trans noise from trans.
    alpha4: 0.05                          # trans noise from rot.

    laser_model_type: "likelihood_field"
    beam_skip_distance: 0.5               # m. Unused: do_beamskip is false.
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 6.0        # m.  TUNED (was 3.0) — RPLidar A1 returns useful
                                          #     range well past 3 m; the shorter cutoff
                                          #     discarded the long scans that constrain pose
                                          #     in open rooms.
    laser_max_range: 12.0                 # m. RPLidar A1 spec.
    laser_min_range: 0.12                 # m. RPLidar A1 spec.
    max_beams: 360                        # Beams used per update.
    pf_err: 0.05
    pf_z: 0.99
    sigma_hit: 0.1                        # m.  TUNED (was 0.2) — tighter measurement model,
                                          #     sharper likelihood peak.
    z_hit: 0.85
    z_max: 0.10
    z_rand: 0.05                          #     TUNED (was 0.10) — less uniform-random mass,
                                          #     so the sensor model discriminates more.
    z_short: 0.0

    resample_interval: 1
    max_particles: 15000
    min_particles: 2500                   #     TUNED (was 1000) — wider coverage during
                                          #     recovery from a bad initial pose.
    recovery_alpha_fast: 0.05             #     TUNED (was 0.1) — less random particle
                                          #     injection. NOTE: this is the parameter that
                                          #     makes tuning COSTLY under extreme kidnap;
                                          #     random injection is what rescues a fully
                                          #     displaced filter.
    recovery_alpha_slow: 0.005
    update_min_a: 0.05                    # rad. Filter update threshold.
    update_min_d: 0.10                    # m.  Filter update threshold.
