# nav2_stack/ablations/mppi_goalw8.yaml
#
# SINGLE-VARIABLE PROBE. Loaded LAST for controller_server, so this override wins.
#
# Changes exactly one thing: MPPI GoalCritic.cost_weight, 15.0 -> 8.0.
#
# The two endpoints are already measured and neither is acceptable:
#
#   weight  5 (original): clean true success 89.5%, but parks 0.150 m short of the
#           0.05 m tolerance for 158 s -- the goal term is outvoted by PathAlign (18)
#           + PathFollow (10) in the final approach. TTC true success 62.5%.
#   weight 15 (66061aa):  clean true success 100%, nav 29 s -- but under bad-init
#           (injected covariance 0.25, estimate swinging while AMCL re-converges) the
#           amplified goal term makes the optimizer dither: 1 cm/s crawls, TTC true
#           success 30.3%. Probing only the clean regime is how this got through.
#
# This probes the midpoint in BOTH regimes. Four of the six (weight x regime) cells
# exist; the two weight-8 cells complete the interaction table.

controller_server:
  ros__parameters:
    FollowPath:
      GoalCritic:
        cost_weight: 8.0                  # PROBE, MPPI. current baseline 15.0, original 5.0
