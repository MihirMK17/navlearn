# nav2_stack/ablations/mppi_iter2.yaml
#
# SINGLE-VARIABLE PROBE into MPPI's final approach. Loaded LAST for controller_server.
#
# Leg 1 (2026-07-30, 120 goals) measured MPPI stalling short of the goal rather than
# failing to reach it: 39 of 83 reported failures had the robot parked within 0.25 m,
# yaw error 0.51 deg median (better than its own successes), position error 0.150 m
# against a 0.05 m tolerance, nav time 158 s median against RPP's 23 s. Reported success
# 30.8% while TRUE success was 62.5% -- the inversion is the tell. MPPI arrives aligned,
# 15 cm short, and cannot close the gap.
#
# Hypothesis: MPPI's control resolution near the goal is coarser than the tolerance it is
# asked to hit, so sampled trajectories over the 2.8 s horizon either overshoot the
# remaining 15 cm or stall, and their weighted mean is approximately no motion.
#
# Shared quantities -- goal tolerance, speed envelope, costmaps -- are untouched, so
# parity holds. What changes is MPPI's own optimizer, which is what makes it a different
# controller. Raising xy_goal_tolerance would be the parity violation, and it is the
# band-aid reached for last time (ablations/high_tolerance.yaml).
#
# Changes exactly one thing: optimizer iterations per control cycle, 1 -> 2.

controller_server:
  ros__parameters:
    FollowPath:
      iteration_count: 2                  # PROBE, MPPI. baseline 1
