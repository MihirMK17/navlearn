name: ROS Humble CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    # Use the official ROS 2 Humble base image so ROS is pre-installed
    container: ros:humble-ros-base

    steps:
      # 1 · Check out your code
      - uses: actions/checkout@v3

      # 2 · Build and test in one shell (keeps the ROS env sourced)
      - name: Build & Test
        shell: bash
        run: |
          set -e
          source /opt/ros/humble/setup.bash

          # Install build tools
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep git python3-pip

          # Lint Python scripts — use python3 -m to avoid PATH issues with pip-installed binaries
          pip3 install black flake8
          python3 -m black --check src/navlearn_benchmarks/scripts/
          python3 -m flake8 --max-line-length=100 src/navlearn_benchmarks/scripts/

          # Initialise rosdep (first run may already be done)
          rosdep init || true
          rosdep update

          # Resolve dependencies
          rosdep install --from-paths src --ignore-src -r -y

          # Build workspace
          colcon build --event-handlers console_cohesion+

          # Test only navlearn packages — bumperbot_* packages have pre-existing lint failures
          # on main that are outside the scope of this project's CI gate
          colcon test --packages-select navlearn_benchmarks navlearn_localization_eval navlearn_msgs bumperbot_utils
          colcon test-result --verbose
